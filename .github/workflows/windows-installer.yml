name: Build Windows Installer and Publish Updates

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional version tag (example: v0.3.0). Leave blank for an automatic build version."
        required: false
        default: ""
        type: string
      publish_stable_release:
        description: "Publish a stable GitHub Release and in-app update feed. Keep disabled for a downloadable test artifact."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rmango-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build and publish Rmango Windows update
    # Build a downloadable, non-release installer from every main commit.
    # Stable GitHub Releases and the auto-update feed remain tag/manual-only.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare editable app source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "app-src" | Out-Null

          if (Test-Path "app/package.json") {
            Copy-Item -Path "app/*" -Destination "app-src" -Recurse -Force
            Write-Host "Using editable source from app/."
          } else {
            $archive = "source/Rmango-source.zip"
            if (-not (Test-Path $archive)) {
              throw "Missing app/ and source/Rmango-source.zip."
            }

            $expectedSha256 = "cc6199d696d18f9f89109f5ff57453effb53176524a079bd668489d0b903546c"
            $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) {
              throw "Source archive SHA256 mismatch. Expected $expectedSha256 but got $actualSha256."
            }

            Expand-Archive -LiteralPath $archive -DestinationPath "app-src" -Force
            Copy-Item -LiteralPath "build/generate-icon.ps1" -Destination "app-src/build/generate-icon.ps1" -Force
            Write-Host "Using verified fallback source archive."
          }

          foreach ($required in @("package.json", "electron/main.ts", "electron/preload.cts", "src/App.tsx", "src/styles.css", "build/generate-icon.ps1", "cloud-config.json")) {
            if (-not (Test-Path (Join-Path "app-src" $required))) {
              throw "Application source is missing required file: $required"
            }
          }

      - name: Generate branded 256x256 mango Windows icon
        shell: pwsh
        run: |
          & "app-src/build/generate-icon.ps1"
          if (-not (Test-Path "app-src/build/icon.ico")) {
            throw "The mango icon generator did not create app-src/build/icon.ico."
          }
          Write-Host "Windows mango icon generated successfully."

      - name: Configure Cloudflare Workers API URL
        id: cloud-config
        shell: pwsh
        run: |
          $configPath = "app-src/cloud-config.json"
          if (-not (Test-Path $configPath)) {
            throw "Missing app/cloud-config.json. A Cloudflare API endpoint must be committed with the desktop app."
          }
          try {
            $existingConfig = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $apiUrl = ([string]$existingConfig.apiBaseUrl).Trim().TrimEnd("/")
          } catch {
            throw "app/cloud-config.json is not valid JSON: $($_.Exception.Message)"
          }
          if (-not $apiUrl) {
            throw "No Cloudflare API URL is configured in app/cloud-config.json."
          }
          $parsed = [Uri]::new($apiUrl)
          if ($parsed.Scheme -ne "https" -or -not $parsed.IsAbsoluteUri) {
            throw "The RMango Cloud API URL must be an absolute HTTPS URL."
          }
          if ($parsed.Host -ne "rmango.abdosony222.workers.dev") {
            throw "The desktop release must target the approved RMango Cloudflare Worker, not a legacy or unverified host."
          }
          @{ apiBaseUrl = $apiUrl } | ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding utf8
          "configured=true" >> $env:GITHUB_OUTPUT
          Write-Host "Configured Rmango Cloud endpoint: $($parsed.Host)"

      - name: Import Windows code-signing certificate
        id: signing
        shell: pwsh
        env:
          RMANGO_SIGNING_PFX_BASE64: ${{ secrets.RMANGO_SIGNING_PFX_BASE64 }}
          RMANGO_SIGNING_PFX_PASSWORD: ${{ secrets.RMANGO_SIGNING_PFX_PASSWORD }}
        run: |
          $encoded = ($env:RMANGO_SIGNING_PFX_BASE64 -replace '\s', '')
          $hasCertificate = $false

          if ($encoded -and $env:RMANGO_SIGNING_PFX_PASSWORD -and $encoded -match '^[A-Za-z0-9+/]+={0,2}$') {
            try {
              $bytes = [Convert]::FromBase64String($encoded)
              if ($bytes.Length -le 0) { throw "The signing PFX file is empty." }
              $certificatePath = Join-Path $env:RUNNER_TEMP "rmango-signing.pfx"
              [System.IO.File]::WriteAllBytes($certificatePath, $bytes)
              "WIN_CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
              "WIN_CSC_KEY_PASSWORD=$env:RMANGO_SIGNING_PFX_PASSWORD" >> $env:GITHUB_ENV
              $hasCertificate = $true
              Write-Host "Windows publisher certificate file imported."
            } catch {
              throw "The configured Windows signing PFX is invalid or unreadable: $($_.Exception.Message)"
            }
          } elseif ($encoded -or $env:RMANGO_SIGNING_PFX_PASSWORD) {
            throw "RMANGO_SIGNING_PFX_BASE64 and RMANGO_SIGNING_PFX_PASSWORD must both be configured."
          } else {
            Write-Warning "No trusted publisher certificate configured. This build will be an unsigned CI artifact only; no stable release or update feed will be published."
          }

          if ($hasCertificate) {
            "RMANGO_HAS_SIGNING_CERT=true" >> $env:GITHUB_ENV
            "has_certificate=true" >> $env:GITHUB_OUTPUT
          } else {
            "RMANGO_HAS_SIGNING_CERT=false" >> $env:GITHUB_ENV
            "has_certificate=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $packagePath = "app-src/package.json"
          $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $requestedTag = "${{ inputs.tag_name }}".Trim()
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"

          if ($requestedTag) {
            $version = $requestedTag -replace '^v', ''
          } elseif ($refType -eq "tag") {
            $version = $refName -replace '^v', ''
          } else {
            $base = [regex]::Match($package.version, '^(?<major>\d+)\.(?<minor>\d+)\.\d+')
            if (-not $base.Success) {
              throw "The base package version '$($package.version)' is not a valid major.minor.patch version."
            }
            # Each main-branch build receives a strictly increasing patch number.
            $version = "$($base.Groups['major'].Value).$($base.Groups['minor'].Value).${{ github.run_number }}"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$version'. Use semantic versioning, for example 0.3.0."
          }

          $package.version = $version
          if ($env:RMANGO_HAS_SIGNING_CERT -eq "true") {
            $package.build.win.verifyUpdateCodeSignature = $true
          } else {
            # Current public builds are unsigned. SHA-512 metadata and HTTPS are still checked.
            $package.build.win.verifyUpdateCodeSignature = $false
          }
          Set-Content -LiteralPath $packagePath -Value ($package | ConvertTo-Json -Depth 100) -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building Rmango $version"
          Write-Host "Publisher-signing configured: $env:RMANGO_HAS_SIGNING_CERT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-src/package.json

      - name: Install dependencies
        working-directory: app-src
        run: npm install --no-audit --no-fund

      - name: Test saved cloud-session validation
        working-directory: app-src
        run: npm run test:session

      - name: Test cloud chat session refresh and retry
        working-directory: app-src
        run: npm run test:cloud-session-request

      - name: Test built-in Roblox Studio MCP path discovery
        working-directory: app-src
        run: npm run test:studio-mcp-path

      - name: Build and optionally publish Windows installer
        working-directory: app-src
        env:
          GH_TOKEN: ${{ github.token }}
          RMANGO_CLOUD_CONFIGURED: ${{ steps.cloud-config.outputs.configured }}
          RMANGO_PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_stable_release == true) }}
        shell: pwsh
        run: |
          if ($env:RMANGO_CLOUD_CONFIGURED -eq "true" -and $env:RMANGO_HAS_SIGNING_CERT -eq "true" -and $env:RMANGO_PUBLISH_RELEASE -eq "true") {
            # Only a verified publisher build with explicit release intent may publish.
            npm run dist:win:publish
          } else {
            # Manual builds default to a downloadable CI artifact; no stable release is created.
            npm run dist:win
            if ($env:RMANGO_CLOUD_CONFIGURED -eq "true" -and $env:RMANGO_HAS_SIGNING_CERT -ne "true") {
              Write-Warning "No trusted publisher certificate is configured. Built a downloadable CI artifact only; no public release or update feed was published."
            } elseif ($env:RMANGO_CLOUD_CONFIGURED -eq "true") {
              Write-Host "Stable publishing was not requested. Built a downloadable CI artifact only."
            } else {
              Write-Warning "Cloud URL is missing, so this installer is CI-only and cannot be discovered by the in-app updater."
            }
          }

      - name: Verify setup executable and update manifest
        id: verify
        env:
          RMANGO_PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_stable_release == true) }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installerPattern = "Rmango-Setup-$version-x64.exe"
          $installer = Get-ChildItem -Path "app-src/release" -Filter $installerPattern -File | Select-Object -First 1
          if (-not $installer) {
            throw "Build did not produce $installerPattern."
          }

          $configured = "${{ steps.cloud-config.outputs.configured }}"
          $signed = "${{ steps.signing.outputs.has_certificate }}"
          $manifest = Join-Path "app-src/release" "latest.yml"
          $willPublish = $configured -eq "true" -and $signed -eq "true" -and $env:RMANGO_PUBLISH_RELEASE -eq "true"
          if ($willPublish) {
            if (-not (Test-Path $manifest)) {
              throw "Missing latest.yml. The auto-update feed would not work."
            }

            $manifestText = Get-Content -LiteralPath $manifest -Raw
            if ($manifestText -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
              throw "latest.yml does not describe this build version ($version)."
            }
            Write-Host "Auto-update manifest: $manifest"
          } else {
            Write-Host "CI-only installer artifact. No public GitHub Release or update feed will be published."
          }

          $sizeMb = [math]::Round($installer.Length / 1MB, 2)
          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "installer_sha256=$sha256" >> $env:GITHUB_OUTPUT
          "signature_status=$($signature.Status)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $sizeMb MB"
          Write-Host "SHA256: $sha256"
          Write-Host "Authenticode status: $($signature.Status)"
          if ($env:RMANGO_HAS_SIGNING_CERT -eq "true" -and $signature.Status -ne "Valid") {
            throw "A signing certificate was configured, but the installer signature is not valid."
          }

      - name: Verify public GitHub Release contains the update feed
        if: >-
          steps.cloud-config.outputs.configured == 'true' &&
          steps.signing.outputs.has_certificate == 'true' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_stable_release == true))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $uri = "https://api.github.com/repos/abdelrmamsaahlan-max/rmango/releases/tags/$tag"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $expectedInstaller = "Rmango-Setup-${{ steps.version.outputs.version }}-x64.exe"
          if ($assetNames -notcontains $expectedInstaller) {
            throw "The GitHub Release does not contain $expectedInstaller."
          }
          if ($assetNames -notcontains "latest.yml") {
            throw "The GitHub Release does not contain latest.yml; installed apps cannot find updates."
          }
          Write-Host "Published release $tag with installer and latest.yml."
          Write-Host "Release URL: $($release.html_url)"

      - name: Save setup EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rmango-Windows-Setup-${{ steps.version.outputs.version }}
          path: ${{ steps.verify.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 14
