name: RMango Desktop Build Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/desktop-build-check.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/desktop-build-check.yml"

permissions:
  contents: read

concurrency:
  group: rmango-desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck and package renderer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Electron and React code
        run: npm run typecheck

      - name: Build desktop renderer and Electron main process
        run: npm run build
