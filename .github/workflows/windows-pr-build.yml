name: Verify Rmango Windows Desktop

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/windows-pr-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/windows-pr-build.yml"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: rmango-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Type-check and package Windows desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Type-check and build Windows installer
        working-directory: app
        run: npm run dist:win

      - name: Verify setup executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "app/release" -Filter "Rmango-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows installer was not produced."
          }
          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $sha256"

      - name: Upload pull-request installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rmango-Windows-Build-${{ github.run_number }}
          path: app/release/Rmango-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7
