name: RMango Windows Preview Installer

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/windows-preview-installer.yml"

permissions:
  contents: read

concurrency:
  group: rmango-windows-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Build unsigned Windows preview installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set a preview-only version
        shell: pwsh
        working-directory: app
        run: |
          $packagePath = "package.json"
          $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $package.version = "0.2.325-preview.${{ github.run_number }}"
          Set-Content -LiteralPath $packagePath -Value ($package | ConvertTo-Json -Depth 100) -Encoding utf8
          Write-Host "Building preview version $($package.version); no public release will be created. This version supersedes the reported v0.2.324 desktop build."

      - name: Verify the desktop targets the Cloudflare Worker
        shell: pwsh
        working-directory: app
        run: |
          $config = Get-Content -LiteralPath "cloud-config.json" -Raw | ConvertFrom-Json
          $uri = [Uri]::new(([string]$config.apiBaseUrl).Trim())
          if ($uri.Scheme -ne "https" -or $uri.Host -ne "rmango.abdosony222.workers.dev") {
            throw "The preview must target the verified RMango Cloudflare Worker."
          }
          Write-Host "Cloudflare endpoint verified: $($uri.Host)"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: app
        run: npm run dist:win

      - name: Verify installer and generate SHA-256
        id: verify
        shell: pwsh
        working-directory: app
        run: |
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $name = "Rmango-Setup-$version-x64.exe"
          $installer = Join-Path "release" $name
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "The Windows installer was not created: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii
          "installer_path=$installer" >> $env:GITHUB_OUTPUT
          "installer_name=$name" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $name"
          Write-Host "SHA256: $hash"

      - name: Upload preview installer (14-day artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RMango-Windows-Preview-${{ github.run_number }}
          path: |
            app/${{ steps.verify.outputs.installer_path }}
            app/${{ steps.verify.outputs.installer_path }}.sha256
          if-no-files-found: error
          retention-days: 14
