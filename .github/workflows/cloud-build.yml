name: Build Rmango Cloud Backend

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  workflow_dispatch:
    inputs:
      confirm_replace_rmango:
        description: "Confirm that this deployment will replace the current rmango starter Worker with the RMango application."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rmango-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud:
    name: Type-check and build Next.js cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check cloud backend
        run: npm run typecheck

      - name: Build and validate Cloudflare Worker package (no deployment)
        run: npm run cf-check

  desktop:
    name: Type-check and build RMango desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check renderer and Electron
        run: npm run typecheck

      - name: Build desktop renderer and Electron process
        run: npm run build

  deploy:
    name: Manually deploy RMango to Cloudflare Workers
    needs: cloud
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_replace_rmango == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install cloud dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          npx wrangler whoami

      - name: Build and deploy RMango Cloud
        run: npm run cf-deploy

      - name: Deployment handoff
        shell: bash
        run: |
          {
            echo "## RMango Cloudflare deployment submitted"
            echo ""
            echo "Worker name: `rmango`"
            echo ""
            echo "Expected Worker URL: https://rmango.abdosony222.workers.dev"
            echo "Open Cloudflare Workers & Pages to confirm the production version is active."
            echo "Configure the three Supabase runtime secrets before testing /api/health:"
            echo "`SUPABASE_URL`, `SUPABASE_PUBLISHABLE_KEY`, and `SUPABASE_SECRET_KEY`."
            echo ""
            echo "The desktop app still uses its current API URL. Do not change it until health, authenticated chat, Studio tools, project storage, and a new installer are verified."
          } >> "$GITHUB_STEP_SUMMARY"
