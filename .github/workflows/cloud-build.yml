name: Build Rmango Cloud Backend

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - "app/**"
      - ".github/workflows/cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud/**"
      - "app/**"
      - ".github/workflows/cloud-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmango-cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Type-check and build Next.js cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check cloud backend
        run: npm run typecheck

      - name: Build cloud backend
        run: npm run build

  desktop:
    name: Type-check and package Windows desktop
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and package Windows installer
        run: npm run dist:win

      - name: Verify setup executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "Rmango-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows installer was not produced."
          }
          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "SHA256: $sha256"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rmango-Windows-${{ github.run_number }}
          path: app/release/Rmango-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 7
