name: Build Rmango Cloud Backend

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmango-cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Type-check and build Next.js cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # OpenNext's Cloudflare dev bridge opens a remote binding proxy during its build.
    # Keep the scoped deployment token available only to this cloud validation job.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Cloudflare Worker binding types
        run: npx wrangler types --env-interface CloudflareEnv

      - name: Type-check cloud backend
        run: npm run typecheck

      - name: Build Cloudflare Worker artifact
        run: npm run build:cloudflare


  desktop:
    name: Type-check and build RMango desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check renderer and Electron
        run: npm run typecheck

      - name: Build desktop renderer and Electron process
        run: npm run build

  deploy:
    name: Deploy and verify RMango on Cloudflare
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs:
      - cloud
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RMANGO_EXPECTED_SUPABASE_HOST: jqkcrtnbxewyqrdpnqap.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deployment targets and protected secrets
        run: |
          node --input-type=module <<'NODE'
          const required = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SECRET_KEY"];
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`Missing required GitHub Actions secret: ${name}`);
          }
          const url = new URL(process.env.SUPABASE_URL);
          if (url.protocol !== "https:" || url.hostname !== process.env.RMANGO_EXPECTED_SUPABASE_HOST || url.username || url.password) {
            throw new Error("SUPABASE_URL does not match the intended RMango Supabase project. No deployment was started.");
          }
          if (!process.env.SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")) {
            throw new Error("SUPABASE_PUBLISHABLE_KEY is not a Supabase publishable key. No deployment was started.");
          }
          if (!process.env.SUPABASE_SECRET_KEY.startsWith("sb_secret_")) {
            throw new Error("SUPABASE_SECRET_KEY is not a Supabase secret key. No deployment was started.");
          }
          console.log("Deployment target verified. Secret values were not printed.");
          NODE

      - name: Deploy Worker and synchronize protected Supabase secrets
        run: npm run deploy:cloudflare

      - name: Smoke-test live Cloudflare health endpoint
        working-directory: .
        env:
          RMANGO_HEALTH_URL: https://rmango.abdosony222.workers.dev/api/health
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.RMANGO_HEALTH_URL;
          const response = await fetch(url, {
            method: "GET",
            headers: { "accept": "application/json" },
            signal: AbortSignal.timeout(20000),
          });
          const raw = await response.text();
          let health;
          try {
            health = JSON.parse(raw);
          } catch {
            throw new Error(`Cloudflare health endpoint returned non-JSON (HTTP ${response.status}): ${raw.slice(0, 500)}`);
          }
          if (!response.ok || health.status !== "ready" || health.aiReady !== true || health.databaseReachable !== true) {
            throw new Error(`Cloudflare is not ready after deployment (HTTP ${response.status}): ${health.error || JSON.stringify(health)}`);
          }
          console.log("Cloudflare health passed: AI binding, Supabase connectivity, and global inference policy are ready.");
          NODE
