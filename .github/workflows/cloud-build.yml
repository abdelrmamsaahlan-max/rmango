name: Build Rmango Cloud Backend

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmango-cloud-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Type-check and build Next.js cloud API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # OpenNext's Cloudflare dev bridge opens a remote binding proxy during its build.
    # Keep the scoped deployment token available only to this cloud validation job.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Cloudflare Worker binding types
        run: npx wrangler types --env-interface CloudflareEnv

      - name: Type-check cloud backend
        run: npm run typecheck

      - name: Build Cloudflare Worker artifact
        run: npm run build:cloudflare


  desktop:
    name: Type-check and build RMango desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check renderer and Electron
        run: npm run typecheck

      - name: Build desktop renderer and Electron process
        run: npm run build

  deploy:
    name: Deploy and verify RMango on Cloudflare
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - cloud
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify existing Cloudflare runtime secrets
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token?.trim() || !accountId?.trim()) {
            throw new Error("Cloudflare deployment credentials are missing. No deployment was started.");
          }
          const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/rmango/secrets`;
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${token}`,
              accept: "application/json",
            },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) {
            throw new Error(`Could not verify the existing Worker secret metadata (HTTP ${response.status}). No deployment was started.`);
          }
          const payload = await response.json();
          if (payload.success !== true || !Array.isArray(payload.result)) {
            throw new Error("Cloudflare returned an invalid secret-metadata response. No deployment was started.");
          }
          const names = new Set(payload.result.map(item => item.name));
          const required = ["SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "SUPABASE_SECRET_KEY"];
          const missing = required.filter(name => !names.has(name));
          if (missing.length) {
            throw new Error("The existing Worker is missing required Supabase runtime secrets: " + missing.join(", ") + ". No deployment was started.");
          }
          console.log("All three existing Supabase Worker secrets are present. Their values were not read or changed.");
          NODE

      - name: Deploy Worker while preserving existing Supabase secrets
        run: npx opennextjs-cloudflare deploy

      - name: Smoke-test live Cloudflare health endpoint
        working-directory: .
        env:
          RMANGO_HEALTH_URL: https://rmango.abdosony222.workers.dev/api/health
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.RMANGO_HEALTH_URL;
          const response = await fetch(url, {
            method: "GET",
            headers: { "accept": "application/json" },
            signal: AbortSignal.timeout(20000),
          });
          const raw = await response.text();
          let health;
          try {
            health = JSON.parse(raw);
          } catch {
            throw new Error(`Cloudflare health endpoint returned non-JSON (HTTP ${response.status}): ${raw.slice(0, 500)}`);
          }
          if (!response.ok || health.status !== "ready" || health.aiReady !== true || health.databaseReachable !== true) {
            throw new Error(`Cloudflare is not ready after deployment (HTTP ${response.status}): ${health.error || JSON.stringify(health)}`);
          }
          console.log("Cloudflare health passed: AI binding, Supabase connectivity, and global inference policy are ready.");
          NODE
