name: Build Rmango Desktop

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    branches:
      - main
      - upgrade/project-context-retrieval
      - upgrade/agent-workspace-studio
      - upgrade/rmango-native-identity-ui
    paths:
      - "app/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmango-desktop-build
  cancel-in-progress: true

jobs:
  desktop:
    name: Type-check and build Electron desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-fund

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Type-check Electron and renderer
        run: npm run typecheck

      - name: Build Electron main and renderer
        run: npm run build
